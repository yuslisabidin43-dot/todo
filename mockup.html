<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Do – Phone Mockups</title>
<style>
  body { margin: 0; padding: 24px; background: #e9ecf1; font-family: system-ui, sans-serif; }
  h1 { text-align: center; margin: 0 0 24px; }
  h2 { margin: 0 0 12px; font-size: 20px; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; align-items: flex-start; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 12px; color: #444; font-size: 14px; }
  .phone { background: #111; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); position: relative; }
  .phone iframe { display: block; border: 0; background: #fff; }
  /* iPhone: tall rounded corners + dynamic island */
  .iphone { border-radius: 56px; }
  .iphone iframe { width: 402px; height: 874px; border-radius: 44px; }
  .iphone::after { content: ""; position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
                   width: 110px; height: 32px; background: #000; border-radius: 16px; }
  /* Galaxy: slimmer bezel, smaller corners, punch-hole camera */
  .galaxy { border-radius: 36px; padding: 8px; }
  .galaxy iframe { width: 360px; height: 780px; border-radius: 28px; }
  .galaxy::after { content: ""; position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
                   width: 14px; height: 14px; background: #000; border-radius: 50%; border: 2px solid #222; }
  /* leave room under the camera cutouts */
  .phone iframe { box-sizing: border-box; }
</style>
</head>
<body>
<h1>To Do App – Phone Mockups</h1>
<div class="row">
  <figure>
    <h2>iPhone</h2>
    <div class="phone iphone"><iframe src="index.html" title="iPhone"></iframe></div>
    <figcaption>402 × 874</figcaption>
  </figure>
  <figure>
    <h2>Samsung Galaxy S26</h2>
    <div class="phone galaxy"><iframe src="index.html" title="Galaxy"></iframe></div>
    <figcaption>360 × 780 (assumed)</figcaption>
  </figure>
</div>
</body>
</html>
